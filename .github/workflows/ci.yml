name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  integration:
    name: Tests against a real Docker daemon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The runner has Docker; the tests create and remove dc0s-it-… objects.
      - run: go vet -tags integration ./internal/integration/...
      - run: go test -tags integration -count=1 ./internal/integration/...

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    name: Build the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t dc0s:ci .
      # The image starts and answers.
      - run: |
          docker run -d --name dc0s-ci -p 127.0.0.1:8080:8080 dc0s:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/api/session && exit 0
            sleep 1
          done
          docker logs dc0s-ci
          exit 1
