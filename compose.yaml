# Run the panel on this machine:  docker compose up -d
# Then open http://localhost:8080

services:
  dc0s:
    image: dc0s:dev
    build: .
    restart: unless-stopped
    # Stopping waits for a running action (a pull & restart, say) to finish
    # rather than leaving a container half replaced.
    stop_grace_period: 3m
    ports:
      # Reachable from this machine only. The panel can open shells in your
      # containers and show their secrets; do not publish it more widely
      # without setting DC0S_PASSWORD.
      - "127.0.0.1:8080:8080"
    volumes:
      - dc0s-data:/data
      # The local Docker daemon, offered as host "local" on first run.
      - /var/run/docker.sock:/var/run/docker.sock
      # For ssh:// hosts: your SSH keys and config, read-only. The panel
      # copies them into place with the ownership ssh requires.
      # - ~/.ssh:/ssh:ro
    # environment:
    #   DC0S_PASSWORD: change-me
    #   DC0S_ALLOWED_HOSTS: panel.lan

volumes:
  dc0s-data:
